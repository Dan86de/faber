name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # No dependency cache in a job that publishes; registry-url lets npm find its OIDC credentials.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # Opens or updates the Version PR while changesets are pending.
      - name: Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: version faber"
          title: "chore: version faber"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With no changesets left, publishes through trusted publishing: npm authenticates with OIDC, no stored token.
      - name: Publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release
